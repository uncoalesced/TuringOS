# /run is a fresh tmpfs at boot, so the trust stack's runtime dirs must be
# recreated here (before any daemon binds a socket).
d /run/turingos 0755 turingos turingos -
# 1777 drop-box: each graphical session drops shell-<uid>.sock here for
# turingos-bridged-ws. The session user can't write into /run/turingos (owned
# by `turingos`) and `turingos` can't traverse /run/user/<uid>, so they meet
# in the middle; SO_PEERCRED on the helper decides who may run commands.
d /run/turingos/session 1777 turingos turingos -
