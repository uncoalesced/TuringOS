# TuringOS Hyprland configuration — /etc/turingos/hyprland.conf
# Loaded by session/turingos-hyprland (Hyprland -c). hyprlang: 0.55 still
# reads .conf files; a user's ~/.config/hypr/hyprland.lua would win, which
# is fine — this file only needs to define the TuringOS desktop contract.
#
# The shell window (class turingos-shell — the Brave --app window
# turingos-kiosk opens on Chromium's Wayland ozone platform, where Brave
# ignores --class and takes its app id from the --app URL instead:
# brave-127.0.0.1__-Default) IS the desktop: pinned to every workspace,
# maximized edge to edge, frameless. Everything else floats above it, opened
# centered — the cascade. This is the twin of the openbox rules in hook
# 0475; the keybinds below are the twin of what openbox's rc.xml provides.

# ── Displays ──────────────────────────────────────────────────────────────────
monitor = ,preferred,auto,1

# ── Startup (the openbox autostart, in Wayland) ───────────────────────────────
exec-once = /usr/lib/turingos/session/turingos-hyprland-autostart

# ── Environment ───────────────────────────────────────────────────────────────
env = XCURSOR_SIZE,24
# Qt picks wayland when its plugin exists and falls back to XWayland otherwise;
# Calamares (qt6-qpa-plugins, X-only here) needs that fallback to work

# ── Input ─────────────────────────────────────────────────────────────────────
input {
    kb_layout = us
    kb_variant = intl
    # Click to focus. With follow_mouse the maximized shell would steal
    # focus every time the cursor crossed the bare desktop
    follow_mouse = 0
}

# ── The layered look: gaps, gradient borders, rounded corners, soft shadow ────
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgb(e85002) rgb(f16001) 45deg
    col.inactive_border = rgb(333333)
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.94

    shadow {
        enabled = true
        range = 16
        render_power = 3
        color = rgba(000000ee)
    }
}

animations {
    enabled = yes
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = windowsIn, 1, 3, easeOut, slide
    animation = windowsOut, 1, 2, easeOut, slide
    animation = layersIn, 1, 3, easeOut, slide
    animation = layersOut, 1, 2, easeOut, slide
    animation = fadeIn, 1, 2, easeOut
    animation = fadeOut, 1, 2, easeOut
    animation = workspacesIn, 1, 3, easeOut, slide
    animation = workspacesOut, 1, 2, easeOut, slide
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    # LightDM exports XDG_CURRENT_DESKTOP=TuringOS from our session's
    # DesktopNames — intentional branding, so silence Hyprland's "managed
    # externally" notice
    disable_xdg_env_checks = true
    # session/turingos-hyprland starts Hyprland directly on purpose:
    # the start-hyprland watchdog restart-loops an unclean exit and would
    # swallow the no-GPU fallback to the X session
    disable_watchdog_warning = true
}

# ── Window rules (evaluated top to bottom) ────────────────────────────────────
# The shell is the desktop: no frame, all workspaces, full work area
windowrule {
    name = shell-desktop
    match:class = ^(turingos-shell|(brave|chrome|chromium)-127\.0\.0\.1__.*)$
    float = on
    maximize = on
    border_size = 0
    no_anim = on
    # Never pin or no_focus this window: pinned floats render above
    # everything (focus can never raise the cascade), and no_focus cuts
    # dock clicks entirely. The cascade needs focus-based stacking.
}

# Everything else floats above the shell, opened centered: the cascade.
# (For the shell this second rule is a no-op: centering a maximized-size
# window lands on the same rectangle.)
windowrule {
    name = float-everything
    match:class = ^.*$
    float = on
    center = on
}

# ── Keys — the openbox session's contract (hook 0475) ─────────────────────────
bind = SUPER, ESCAPE, exec, foot
bind = SUPER, Q, exec, foot
bind = SUPER, SPACE, exec, /usr/lib/turingos/session/turingos-omni
bind = SUPER SHIFT, Q, killactive
bind = SUPER, F, togglefloating
bind = SUPER, TAB, cyclenext
# Omni stashes other windows on this special workspace; Alt+Tab shows them,
# Super+1..5 moves the focused one home (emptied, the overlay hides itself)
bind = ALT, TAB, togglespecialworkspace, turingos-omni
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
