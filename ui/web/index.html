<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- ipc: is how the Tauri backend answers; there is no other network access from the page -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; connect-src ipc: http://ipc.localhost" />
  <title>TuringOS</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/menubar.css" />
  <link rel="stylesheet" href="css/desktop.css" />
  <link rel="stylesheet" href="css/composer.css" />
  <link rel="stylesheet" href="css/model-picker.css" />
  <link rel="stylesheet" href="css/mention.css" />
  <link rel="stylesheet" href="css/weather.css" />
  <link rel="stylesheet" href="css/corners.css" />
  <link rel="stylesheet" href="css/theme-reveal.css" />
  <link rel="stylesheet" href="css/panel.css" />
  <link rel="stylesheet" href="css/clawd.css" />
  <link rel="stylesheet" href="css/dock.css" />
  <link rel="stylesheet" href="css/palette.css" />
  <link rel="stylesheet" href="css/app-window.css" />
  <link rel="stylesheet" href="css/bazaar.css" />
  <script src="js/theme.js"></script>
</head>

    <symbol id="wx-storm" viewBox="0 0 24 24"><path d="M19 16.9A5 5 0 0 0 18 7h-1.26a8 8 0 1 0-11.62 9" /><polyline points="13 11 9 17 15 17 11 23" /></symbol>

  </svg>

  <header class="menubar">
    <div class="menubar-side">
      <span class="brand">
        <svg class="spark brand-spark" aria-hidden="true"><use href="#claude-spark" /></svg>
        TuringOS
      </span>
    </div>

    <div class="menubar-side">
      <span class="tray" id="wifi" title="Wi-Fi">
        <svg class="icon" aria-hidden="true"><use href="#ic-wifi" /></svg>
      </span>
      <span class="tray" id="battery" title="Battery">
        <svg class="icon battery-icon" viewBox="0 0 24 24" aria-hidden="true">
          <use href="#ic-battery" />
          <rect class="battery-fill" x="3" y="8" width="14" height="8" rx="1" />
        </svg>
        <span class="battery-label"></span>
      </span>
      <button class="tray tray-button" id="theme-toggle" aria-label="Switch light and dark">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="5.8" /><path class="fill" d="M8 2.2a5.8 5.8 0 0 1 0 11.6z" />
        </svg>
      </button>
      <span class="clock" id="menubar-clock"></span>
    </div>
  </header>

  <main class="desktop">
    <section class="hero">
      <p class="focused-today" id="focused-today"></p>
      <h1 class="hero-time" id="hero-time"></h1>
      <p class="hero-greeting">
        <svg class="spark hero-greeting-spark" aria-hidden="true"><use href="#claude-spark" /></svg>
        <span id="hero-greeting"></span>
      </p>
    </section>

    <form class="composer" id="composer" autocomplete="off">
      <div class="composer-box">
        <div class="composer-project" id="composer-project" hidden>
          <svg class="icon" aria-hidden="true"><use href="#ic-folder" /></svg>
          <span class="composer-project-name"></span>
          <button type="button" class="composer-project-clear" id="composer-project-clear" aria-label="Remove project">
            <svg class="icon" aria-hidden="true"><use href="#ic-x" /></svg>
          </button>
        </div>
        <textarea id="composer-input" rows="1" placeholder="What do you want to cook?" spellcheck="false"></textarea>
        <div class="composer-row">
          <button type="button" class="icon-button" id="composer-add" aria-label="Pick a project">
            <svg class="icon" aria-hidden="true"><use href="#ic-plus" /></svg>
          </button>
          <span class="composer-hint" id="composer-hint">Type <kbd>@</kbd> to pick a project</span>

          <div class="model-picker">
            <button type="button" class="model-picker-button" id="model-picker-button" aria-haspopup="menu" aria-expanded="false">
              <span id="model-picker-label">Sonnet 5.5</span>
              <span class="model-picker-effort" id="model-picker-effort-label">Medium</span>
            </button>
            <div class="model-menu" id="model-menu" hidden role="menu">
              <div class="model-menu-page" id="model-menu-page-models">
                <!-- .model-option entries are generated in app.js from MODELS, kept here as fallback structure -->
              </div>
              <div class="model-menu-page" id="model-menu-page-effort" hidden>
                <button type="button" class="model-menu-back" id="model-menu-back">
                  <svg class="icon" aria-hidden="true"><use href="#ic-chevron-left" /></svg>
                  Effort
                </button>
                <p class="model-menu-note">Higher effort means more thorough responses, but takes longer.</p>
                <!-- .effort-option entries are generated in app.js from EFFORTS -->
              </div>
            </div>
          </div>

          <button type="button" class="icon-button" id="composer-mic" aria-label="Dictate" aria-pressed="false">
            <svg class="icon" aria-hidden="true"><use href="#ic-mic" /></svg>
          </button>
          <button type="submit" class="send-button" id="composer-send" aria-label="Start" disabled>
            <svg class="icon" aria-hidden="true"><use href="#ic-send" /></svg>
          </button>
        </div>
      </div>
      <div class="mention" id="mention" role="listbox" aria-label="Projects" hidden></div>
    </form>

    <div class="composer-answer" id="composer-answer"></div>
  </main>

  <button class="weather" id="weather" type="button" aria-haspopup="dialog" aria-expanded="false" hidden>
    <span class="weather-now">
      <svg class="icon wx"><use class="wx-use" href="#wx-sun" /></svg>
      <span class="weather-temp"></span>
    </span>
    <span class="weather-city"></span>
  </button>

  <section class="weather-card" id="weather-card" role="dialog" aria-label="Weather" hidden>
    <header class="wc-head">
      <svg class="icon wx"><use class="wx-use" href="#wx-sun" /></svg>
      <span class="wc-title"></span>
    </header>
    <p class="wc-cond"></p>
    <div class="wc-main">
      <div class="wc-big">
        <svg class="icon wx wx-big"><use class="wx-use" href="#wx-sun" /></svg>
        <span class="wc-temp"></span>
      </div>
      <dl class="wc-facts">
        <dt>Feels like</dt><dd class="wc-feels"></dd>
        <dt>Recent rain</dt><dd class="wc-rain"></dd>
        <dt>Wind</dt><dd><svg class="icon wx wc-arrow"><use href="#wx-arrow" /></svg><span class="wc-wind"></span></dd>
      </dl>
    </div>
    <footer class="wc-foot">Weather data by Open-Meteo</footer>
  </section>

  <footer class="corner corner-left">
    <span class="status" id="corner-agent" data-state="idle">
      <span class="dot"></span>
      <span class="corner-label"></span>
    </span>
    <span class="corner-task" id="corner-task"></span>
  </footer>
  <footer class="corner corner-right" id="corner-system"></footer>

  <p class="sample-badge" id="sample-badge" hidden>Sample data · TuringOS isn't set up on this machine</p>

  <!-- Hovering this bottom sliver reveals the dock, like the real macOS one. -->
  <div class="dock-edge" id="dock-edge"></div>
  <p class="dock-error" id="dock-error" hidden></p>
  <span class="dock-tooltip" id="dock-tooltip"></span>
  <nav class="dock" id="dock" aria-label="Dock">
    <button class="dock-item" type="button" data-app="terminal" data-label="Terminal" aria-label="Terminal">
      <svg class="icon" aria-hidden="true"><use href="#ic-terminal" /></svg>
    </button>
    <button class="dock-item" type="button" data-app="files" data-label="Files" aria-label="Files">
      <svg class="icon" aria-hidden="true"><use href="#ic-folder" /></svg>
    </button>
    <button class="dock-item" type="button" data-app="browser" data-label="Browser" aria-label="Browser">
      <svg class="icon" aria-hidden="true"><use href="#ic-globe" /></svg>
    </button>
    <button class="dock-item dock-item--bazaar" type="button" data-app="bazaar" data-label="Bazaar" aria-label="Bazaar">
      <svg class="icon" aria-hidden="true"><use href="#ic-bag" /></svg>
    </button>
    <button class="dock-item" type="button" data-app="install" data-label="Install TuringOS" aria-label="Install TuringOS" hidden>
      <svg class="icon" aria-hidden="true"><use href="#ic-download" /></svg>
    </button>
    <button class="dock-item" type="button" data-app="settings" data-label="Settings" aria-label="Settings">
      <svg class="icon" aria-hidden="true"><use href="#ic-settings" /></svg>
    </button>
  </nav>

  <aside class="side-panel" id="side-panel" aria-label="Notification Center">
    <section class="panel-group" aria-labelledby="notif-title">
      <header class="panel-group-head">
        <h2 id="notif-title">Notifications</h2>
        <button class="panel-clear" id="notif-clear" type="button" aria-label="Clear notifications">
          <svg class="icon" aria-hidden="true"><use href="#ic-x" /></svg>
        </button>
      </header>
      <div class="panel-stack" id="notif-list"></div>
    </section>

    <section class="panel-group" aria-labelledby="calendar-title">
      <header class="panel-group-head">
        <h2 id="calendar-title">Google Calendar</h2>
        <svg class="icon" aria-hidden="true"><use href="#ic-calendar" /></svg>
      </header>
      <div class="panel-card" id="calendar-body"></div>
    </section>

    <section class="panel-group" aria-labelledby="github-title">
      <header class="panel-group-head">
        <h2 id="github-title">GitHub</h2>
        <svg class="icon" aria-hidden="true"><use href="#ic-github" /></svg>
      </header>
      <div class="panel-card" id="github-body"></div>
    </section>
  </aside>

  <!-- Clawd: a small pixel mascot that patrols a corner near the dock and
       answers one-off questions via Haiku. -->
  <button class="clawd" id="clawd" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="Ask Clawd">
    <span class="clawd-body">
      <span class="clawd-eye clawd-eye-l"></span>
      <span class="clawd-eye clawd-eye-r"></span>
      <span class="clawd-leg clawd-leg-l"></span>
      <span class="clawd-leg clawd-leg-r"></span>
    </span>
  </button>

  <section class="clawd-chat" id="clawd-chat" hidden role="dialog" aria-label="Ask Clawd">

      <svg class="spark" aria-hidden="true"><use href="#claude-spark" /></svg>
      <span>Clawd</span>
    </header>
    <form id="clawd-form" autocomplete="off">
      <textarea id="clawd-input" rows="1" placeholder="Ask Clawd anything" spellcheck="false"></textarea>
      <button type="submit" class="send-button" id="clawd-send" aria-label="Ask">
        <svg class="icon" aria-hidden="true"><use href="#ic-send" /></svg>
      </button>
    </form>
    <div class="clawd-answer" id="clawd-answer"></div>
  </section>
