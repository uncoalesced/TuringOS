[package]
name = "turingos-ui"
version = "0.1.0"
description = "TuringOS desktop shell"
edition = "2021"
# Built with Debian 13's rustc-web/cargo-web (security-updated, 1.96 today):
# plain rustc 1.85 is too old for the patched serde_with/time
rust-version = "1.88"
resolver = "3"
publish = false

[build-dependencies]
tauri-build = { version = "~2.6", features = [] }

[dependencies]
tauri = { version = "~2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["net", "time", "io-util", "sync"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
cpal = "0.15"
whisper-rs = "0.15"

# Security: glib < 0.20.0 has unsound VariantStrIter::impl_get (RUSTSEC-2024-0429,
# GHSA-wrw7-89jp-8q8g, fixed upstream in gtk-rs/gtk-rs-core#1343),
# which calls CStr::from_ptr on a possibly-NULL pointer under optimizations.
# tauri 2.x hard-pins gtk 0.18 -> glib ^0.18, so a version bump is impossible;
# vendor/glib is glib 0.18.5 with the upstream fix (&p -> &mut p) applied.
[patch.crates-io]
glib = { path = "vendor/glib" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
