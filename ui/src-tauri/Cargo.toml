[package]
name = "turingos-ui"
version = "0.1.0"
description = "TuringOS desktop shell"
edition = "2021"
# Debian 13 (the ISO build) ships rustc 1.85: keep every dependency buildable there
rust-version = "1.85"
resolver = "3"
publish = false

[build-dependencies]
tauri-build = { version = "~2.6", features = [] }

[dependencies]
tauri = { version = "~2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["net", "time", "io-util", "sync"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
cpal = "0.15"
whisper-rs = "0.15"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
