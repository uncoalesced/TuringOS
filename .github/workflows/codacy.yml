name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '16 21 * * 4'

# Deny all permissions by default; grant only what each job needs.
permissions: {}

concurrency:
  group: codacy-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR scans only. With this unconditional, a run of pushes
  # killed every scan before it finished (runs 8-14 all "cancelled") and the
  # weekly schedule was cancelled by any push landing during it, so a push to
  # main never produced a completed security scan. main and the schedule now
  # always run to completion; they are one per push/week, not per-commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codacy-security-scan:
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read          # required by actions/checkout
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run Codacy Analysis CLI
        timeout-minutes: 30
        # No SARIF output: the CLI's SARIF writer reads flagged files in the
        # container's non-UTF-8 default charset and dies (MalformedInputException,
        # every run since 2026-10-04), then hangs until the timeout. The launcher
        # passes no env into its container, so the charset can't be fixed here.
        # Results still upload to Codacy with the project token.
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08 # v4.4.7
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: false
          max-allowed-issues: 2147483647
          # The full tool suite ran past the job timeout one tool at a time
          parallel: 4
          tool-timeout: 8minutes

