name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: |
          for f in $(git ls-files '*.sh' '*.hook.chroot' turingos); do bash -n "$f" || exit 1; done

      - name: ShellCheck (errors only)
        run: git ls-files '*.sh' '*.hook.chroot' turingos | xargs shellcheck --shell=bash --severity=error
