name: ISO

# Builds the live ISOs on native runners (amd64 and arm64), so the arm64 image
# does not depend on qemu-user. Manual only: ISO builds take about an hour and
# are not part of the regular CI gate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  iso:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            script: debian-live/build-amd64.sh
          - arch: arm64
            runner: ubuntu-24.04-arm
            script: arm/build.sh
    name: iso (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Build ISO (debian:trixie, privileged)
        env:
          BUILD_SCRIPT: ${{ matrix.script }}
        run: |
          docker run --rm --privileged \
            -e BUILD_SCRIPT -e DEBIAN_FRONTEND=noninteractive \
            -v "$PWD:/work" -w /work debian:trixie bash -euxc '
              apt-get update
              apt-get install -y --no-install-recommends \
                live-build sudo rsync git ca-certificates xorriso squashfs-tools \
                debootstrap dosfstools mtools grub-efi-amd64-bin grub-efi-arm64-bin \
                grub-pc-bin syslinux syslinux-common isolinux
              git config --global --add safe.directory /work
              bash "$BUILD_SCRIPT"
            '

      - name: Checksum
        run: |
          cd debian-live
          sha256sum "turingos-${{ matrix.arch }}.hybrid.iso" | tee "turingos-${{ matrix.arch }}.sha256"
          ls -l turingos-${{ matrix.arch }}.hybrid.iso

      - uses: actions/upload-artifact@v4
        with:
          name: turingos-${{ matrix.arch }}-iso
          path: |
            debian-live/turingos-${{ matrix.arch }}.hybrid.iso
            debian-live/turingos-${{ matrix.arch }}.sha256
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
