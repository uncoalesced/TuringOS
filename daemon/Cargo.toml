[package]
name = "turingosd"
version = "0.2.0"
description = "TuringOS desktop service: what the desktop page needs from the machine, behind turingos-bridged-ws"
edition = "2021"
# Built with Debian 13's rustc-web/cargo-web (security-updated, 1.96 today):
# plain rustc 1.85 is too old for the patched serde_with/time
rust-version = "1.88"
resolver = "3"
publish = false

[dependencies]
# The control socket only (HTTP over a Unix socket, for the hotkey and status)
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["net", "time", "io-util", "sync", "rt-multi-thread", "macros", "signal"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
cpal = "0.15"
whisper-rs = "0.15"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
